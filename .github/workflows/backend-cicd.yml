name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend-cicd.yml"

  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read
  actions: write             # required for GHA cache (cache-to: type=gha)

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: passtheaux

jobs:

  # ───────────────────────────────────────────
  # JOB 1 — Lint, test, and build checks
  # ───────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then
            npm run lint
          else
            echo "::warning::No 'lint' script in package.json — step skipped"
          fi

      - name: Run tests
        run: |
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then
            npm test
          else
            echo "::warning::No 'test' script in package.json — step skipped"
          fi

      - name: Build backend
        run: |
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
            npm run build
          else
            echo "::warning::No 'build' script in package.json — step skipped (plain Express server needs no build)"
          fi

  # ───────────────────────────────────────────
  # JOB 2 — Build Docker image and deploy
  # ───────────────────────────────────────────
  deploy:
    name: Docker Build & Render Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: test

    # Only deploy on pushes to main (PRs only run the test job)
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets and variables
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          MISSING=0
          if [ -z "$DOCKER_USER" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME. Set it in GitHub Repo Settings -> Secrets and variables -> Actions (as Secret or Variable)."
            MISSING=1
          fi
          if [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Missing DOCKERHUB_TOKEN. Set it in GitHub Repo Settings -> Secrets and variables -> Actions -> Secrets."
            MISSING=1
          fi
          if [ -z "$RENDER_HOOK" ]; then
            echo "::warning::Missing RENDER_DEPLOY_HOOK_URL. The final deploy step will fail if this is not set."
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --get \
            --data-urlencode "imgURL=${IMAGE}" \
            "${RENDER_DEPLOY_HOOK_URL}"
